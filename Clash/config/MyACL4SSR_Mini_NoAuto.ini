[custom]
;自用配置：基于 ACL4SSR_Online_Mini_NoAuto 精简规则
;追加两个自定义分组，均为完全自由选择（候选含全部节点），不预设任何具体节点：
;  🇨🇳 禁海外IP之内地网站 -> 自行在面板里选一个大陆节点
;  🤖 禁香港IP之AI工具   -> 自行在面板里选一个海外（非香港）节点
;去广告：支持
;自动测速：不支持

;===== 自定义规则（最高优先级）=====

; Google AI 产品页面本身直连，不走代理（放在 AI工具规则之前，避免被 googleapis.com 吞掉）
ruleset=DIRECT,https://raw.githubusercontent.com/kxjhwbb/openclash_rules/main/Clash/GoogleDirect.list

; 禁海外IP之内地网站 -> 走大陆节点
ruleset=🇨🇳 禁海外IP之内地网站,https://raw.githubusercontent.com/kxjhwbb/openclash_rules/main/Clash/BanOverseaIP_Mainland.list

; 禁香港IP之AI工具 -> 走海外节点
ruleset=🤖 禁香港IP之AI工具,https://raw.githubusercontent.com/kxjhwbb/openclash_rules/main/Clash/BanHKIP_AITools.list

;===== ACL4SSR 基础规则（直连 / 拦截 / 兜底）=====

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

;===== 策略组 =====

custom_proxy_group=🚀 节点选择`select`[]DIRECT`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🇨🇳 禁海外IP之内地网站`select`[]DIRECT`[]REJECT`.*
custom_proxy_group=🤖 禁香港IP之AI工具`select`[]DIRECT`[]REJECT`.*
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择`[]🎯 全球直连`.*

enable_rule_generator=true
overwrite_original_rules=true
