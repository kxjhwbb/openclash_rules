[custom]
;自用配置：基于 ACL4SSR_Online_Mini_NoAuto 精简规则
;追加两个自定义分组，采用正则自动筛选对应地区节点：
;  🇨🇳 禁海外IP之内地网站 -> 自动筛选大陆/回国节点
;  🤖 禁香港IP之AI工具   -> 自动排除香港/大陆节点（仅保留美/日/新等可用海外节点）
;去广告：支持
;自动测速：不支持

;===== 自定义规则（最高优先级）=====

; Google AI 产品页面本身直连，不走代理（放在 AI工具规则之前，避免被 googleapis.com 吞掉）
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/kxjhwbb/openclash_rules@main/Clash/GoogleDirect.list

; 禁海外IP之内地网站 -> 走大陆节点
ruleset=🇨🇳 禁海外IP之内地网站,https://cdn.jsdelivr.net/gh/kxjhwbb/openclash_rules@main/Clash/BanOverseaIP_Mainland.list

; 禁香港IP之AI工具 -> 走海外节点
ruleset=🤖 禁香港IP之AI工具,https://cdn.jsdelivr.net/gh/kxjhwbb/openclash_rules@main/Clash/BanHKIP_AITools.list

;===== ACL4SSR 基础规则（广告拦截 / 兜底）=====

ruleset=🛑 全球拦截,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list
ruleset=DIRECT,[]FINAL

;===== 策略组 =====

custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🇨🇳 禁海外IP之内地网站`select`[]DIRECT`[]REJECT`(回国|大陆|中国|CN|China|上海|北京|广州|深圳|杭州|徐州|江苏|浙江|广东)
custom_proxy_group=🤖 禁香港IP之AI工具`select`[]DIRECT`[]REJECT`^(?!.*(HK|Hong Kong|香港|🇭🇰|CN|China|大陆|中国|回国|🇨🇳)).*

enable_rule_generator=true
overwrite_original_rules=true

